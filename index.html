<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>El ogro y el portal</title>
  <style>
    :root{
      --bg:#111318;
      --panel:#0f1116;
      --paper:#e8d7b7;
      --ink:#1b1b1b;
      --stroke:#111;
      --white:#f4f6ff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    body{ margin:0; background:var(--bg); color:var(--white); }
    header{
      padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.12);
      display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; background:rgba(17,19,24,.9); backdrop-filter: blur(8px);
    }
    .btn{
      cursor:pointer; border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.06); color:var(--white);
      padding:8px 12px; border-radius:10px; font-weight:700;
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:14px; display:flex; flex-direction:column; gap:14px; }

    /* Panel tipo “mockup” */
    .screen{
      border:4px solid #000;
      background: #fff;
      padding:14px;
      display:grid;
      grid-template-columns: 1.35fr 1fr;
      gap:14px;
      align-items:stretch;
    }

    /* Pergamino (placeholder) */
    .scroll{
      background: var(--paper);
      color: var(--ink);
      border:4px solid #000;
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height: 250px;
    }
    .scroll .title{
      font-weight:900;
      letter-spacing:.5px;
      text-transform:uppercase;
      font-size:14px;
    }
    .scroll .text{
      line-height:1.45;
      font-size:14px;
    }

    /* Escena derecha (ogro/portal + items) */
    .stage{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .scene{
      border:0;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:140px;
      position:relative;
    }
    .sceneBox{
      width:120px; height:120px;
      border-radius:18px;
      border:4px solid #000;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:#000;
      background: #eee;
    }
    .ogreMini{
      position:absolute;
      right:-2px;
      top:-2px;
      width:54px; height:54px;
      border:4px solid #000;
      border-radius:999px;
      background:#e8ffe8;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; color:#000;
    }
    .ogreMini.hidden{ display:none; }

    .itemsGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .item{
      border:4px solid #000;
      background:#fff;
      color:#000;
      padding:14px 10px;
      text-align:center;
      font-weight:900;
      user-select:none;
      cursor:grab;
    }
    .item:active{ cursor:grabbing; }
    .item.drop-ok{ outline:4px solid #00c853; outline-offset:2px; }
    .item.drop-bad{ outline:4px solid #ff5252; outline-offset:2px; }

    .hintRow{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      color:#000; font-size:12px; opacity:.8;
    }
    .pill{
      border:2px solid #000; padding:4px 8px; border-radius:999px; font-weight:900;
      background:#fff;
    }

    @media (max-width: 900px){
      .screen{ grid-template-columns: 1fr; }
      .scene{ min-height:110px; }
    }
  </style>
</head>

<body>
<header>
  <div style="font-weight:900;">El ogro y el portal</div>
  <div style="display:flex; gap:10px;">
    <button class="btn" id="btnReloadData">Recargar CSV</button>
    <button class="btn" id="btnNewRun">Nueva partida</button>
  </div>
</header>

<div class="wrap">

  <!-- PANTALLA OGRO -->
  <section class="screen" id="screenOgre">
    <div class="scroll">
      <div class="title" id="ogreTitle">ANTES DEL PORTAL</div>
      <div class="text" id="ogreNarrative">
        Arrastrá un objeto al OGRO o combiná objetos entre sí.
      </div>
      <div class="hintRow">
        <span class="pill" id="pillPhase">FASE: COMBINAR</span>
        <span class="pill" id="pillOgreState">OGRO: —</span>
      </div>
    </div>

    <div class="stage">
      <!-- Dropzone OGRO -->
      <div class="scene" id="ogreZone" aria-label="Ogro (drop)">
        <div class="sceneBox">OGRO</div>
      </div>

      <!-- 4 items -->
      <div class="itemsGrid" id="inventoryOgre"></div>
    </div>
  </section>

  <!-- PANTALLA PORTAL -->
  <section class="screen" id="screenPortal">
    <div class="scroll">
      <div class="title" id="portalTitle">DESPUÉS DEL OGRO</div>
      <div class="text" id="portalNarrative">
        Cuando sobrevivas al ogro, tirá el objeto restante al PORTAL.
      </div>
      <div class="hintRow">
        <span class="pill" id="pillPortalPhase">FASE: PORTAL</span>
        <span class="pill" id="pillEnding">ENDING_ID: —</span>
      </div>
    </div>

    <div class="stage">
      <!-- Dropzone PORTAL -->
      <div class="scene" id="portalZone" aria-label="Portal (drop)">
        <div class="sceneBox">PORTAL</div>
        <div class="ogreMini hidden" id="ogreMini">OG</div>
      </div>

      <!-- mismos 4 slots visuales; se actualizan con el inventario actual -->
      <div class="itemsGrid" id="inventoryPortal"></div>
    </div>
  </section>

</div>

<script>
/* ==== CONFIG ==== */
const CSV_URL = "game_data.csv"; // GitHub Pages lo va a servir OK

/* ==== FALLBACK mínimo (si no carga el CSV) ==== */
const FALLBACK_DATA = {
  items: [
    { id:"pescado", nombre:"PESCADO", tipo:"base" },
    { id:"agua", nombre:"AGUA", tipo:"base" },
    { id:"fuego", nombre:"FUEGO", tipo:"base" },
    { id:"palo", nombre:"PALO", tipo:"base" },
    { id:"magia", nombre:"MAGIA", tipo:"base" },
    { id:"piedra", nombre:"PIEDRA", tipo:"base" },
    { id:"cuerda", nombre:"CUERDA", tipo:"base" },
    { id:"espejo", nombre:"ESPEJO", tipo:"base" }
  ],
  recetas_t1: [],
  ogro: [],
  portal: []
};

let DATA = structuredClone(FALLBACK_DATA);

/* ==== Estado del juego ==== */
const state = {
  phase: "combine",      // combine -> ogre -> portal -> end
  inventory: [],         // ids actuales (máximo 4 en tu diseño)
  ogre: { outcome:null, outcome_id:null, estado_ogro:null, flags:new Set() },
  last_final_outcome_id: null
};

function itemById(id){ return DATA.items.find(x=>x.id===id); }
function itemName(id){ return itemById(id)?.nombre ?? id.toUpperCase(); }
function itemType(id){ return itemById(id)?.tipo ?? "craft"; }
function normalizePair(a,b){ return a < b ? [a,b] : [b,a]; }
function keyPair(a,b){ const [x,y]=normalizePair(a,b); return `${x}__${y}`; }
function randInt(n){ return Math.floor(Math.random()*n); }
function pickDistinct(arr,k){
  const copy=[...arr];
  for(let i=copy.length-1;i>0;i--){ const j=randInt(i+1); [copy[i],copy[j]]=[copy[j],copy[i]]; }
  return copy.slice(0,k);
}

/* ==== Tier1 maps + Tier2 regla ==== */
let T1_MAP = new Map();
let T1_ORIGIN = new Map();

function rebuildTier1Maps(){
  T1_MAP = new Map();
  T1_ORIGIN = new Map();
  for(const r of DATA.recetas_t1){
    const k = keyPair(r.a, r.b);
    T1_MAP.set(k, r.result);
    T1_ORIGIN.set(r.result, normalizePair(r.a, r.b));
  }
}

function tier2Combine(tier1Id, baseId){
  const origin = T1_ORIGIN.get(tier1Id);
  if(!origin) return null;
  const [a,b] = origin;
  if(baseId===a || baseId===b) return null; // tu regla
  return {
    id: `t2__${tier1Id}__${baseId}`,
    nombre: `${itemName(tier1Id)} + ${itemName(baseId)}`,
    tipo: "craft",
  };
}

function combineItems(idA, idB){
  const isBaseA = itemType(idA)==="base";
  const isBaseB = itemType(idB)==="base";

  if(isBaseA && isBaseB){
    const res = T1_MAP.get(keyPair(idA,idB));
    if(!res) return null;
    return { id: res, nombre: itemName(res), tipo: itemType(res) };
  }

  const aIsTier1 = T1_ORIGIN.has(idA);
  const bIsTier1 = T1_ORIGIN.has(idB);

  if(aIsTier1 && isBaseB) return tier2Combine(idA, idB);
  if(bIsTier1 && isBaseA) return tier2Combine(idB, idA);

  return null;
}

/* ==== Render inventario (dos pantallas iguales) ==== */
let dragItemId = null;

function render(){
  document.getElementById("pillPhase").textContent = `FASE: ${state.phase.toUpperCase()}`;
  document.getElementById("pillOgreState").textContent = `OGRO: ${state.ogre.estado_ogro ?? "—"}`;
  document.getElementById("pillEnding").textContent = `ENDING_ID: ${state.last_final_outcome_id ?? "—"}`;
  document.getElementById("pillPortalPhase").textContent = `FASE: ${state.phase === "portal" ? "PORTAL" : state.phase.toUpperCase()}`;

  // ogro mini en portal si el ogro no murió y no estás muerto
  const ogreMini = document.getElementById("ogreMini");
  const ogroVive = state.phase !== "end" && state.ogre.outcome !== "jugador_muere" && state.ogre.estado_ogro && state.ogre.estado_ogro !== "muerto";
  ogreMini.classList.toggle("hidden", !ogroVive);
  ogreMini.textContent = ogroVive ? "OG" : "";

  renderInventoryGrid("inventoryOgre");
  renderInventoryGrid("inventoryPortal");
}

function renderInventoryGrid(containerId){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  for(const id of state.inventory){
    const div = document.createElement("div");
    div.className = "item";
    div.draggable = true;
    div.dataset.itemId = id;
    div.textContent = itemName(id);

    div.addEventListener("dragstart", (e)=>{
      dragItemId = id;
      e.dataTransfer.setData("text/plain", id);
      e.dataTransfer.effectAllowed = "move";
    });
    div.addEventListener("dragend", ()=>{
      dragItemId = null;
      clearDropHints();
    });

    // drop encima de otro item => combinar
    div.addEventListener("dragover", (e)=>{
      e.preventDefault();
      const from = dragItemId;
      const to = id;
      if(!from || from===to) return;
      const res = combineItems(from, to);
      div.classList.toggle("drop-ok", !!res);
      div.classList.toggle("drop-bad", !res);
      e.dataTransfer.dropEffect = res ? "move" : "none";
    });
    div.addEventListener("dragleave", ()=> div.classList.remove("drop-ok","drop-bad"));
    div.addEventListener("drop", (e)=>{
      e.preventDefault();
      const from = e.dataTransfer.getData("text/plain");
      const to = id;
      if(!from || from===to) return;
      const res = combineItems(from, to);
      if(!res){
        setScrollText("ogreNarrative", `No pasa nada al combinar ${itemName(from)} con ${itemName(to)}.`);
        return;
      }
      applyCombination(from, to, res);
    });

    el.appendChild(div);
  }

  // si quedan menos de 4 (porque gastaste uno), relleno visual con slots vacíos (mockup)
  while(el.children.length < 4){
    const s = document.createElement("div");
    s.className = "item";
    s.style.opacity = "0.25";
    s.style.cursor = "default";
    s.draggable = false;
    s.textContent = "—";
    el.appendChild(s);
  }
}

function clearDropHints(){
  document.querySelectorAll(".item.drop-ok,.item.drop-bad").forEach(x=>x.classList.remove("drop-ok","drop-bad"));
}

function ensureCatalogItem(res){
  if(!itemById(res.id)){
    DATA.items.push({ id: res.id, nombre: res.nombre, tipo: res.tipo || "craft" });
  }
}

function applyCombination(fromId, toId, res){
  // consumimos dos y producimos uno (mantiene máximo 4)
  state.inventory = state.inventory.filter(x=>x!==fromId && x!==toId);
  ensureCatalogItem(res);
  state.inventory.push(res.id);

  // si todavía estás en combine, te dejo seguir combinando pero ya habilitás ogro
  state.phase = "ogre";
  setScrollText("ogreNarrative", `${itemName(fromId)} + ${itemName(toId)} → ${itemName(res.id)}.`);
  render();
}

/* ==== Dropzones OGRO / PORTAL ==== */
function setupDropZone(el, onDrop){
  el.addEventListener("dragover", (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; });
  el.addEventListener("drop", (e)=>{
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    if(!id) return;
    onDrop(id);
  });
}

setupDropZone(document.getElementById("ogreZone"), (itemId)=>{
  if(state.phase !== "combine" && state.phase !== "ogre") return;
  useOnOgre(itemId);
});

setupDropZone(document.getElementById("portalZone"), (itemId)=>{
  if(state.phase !== "portal") return;
  useOnPortal(itemId);
});

function removeFromInventory(itemId){
  state.inventory = state.inventory.filter(x=>x!==itemId);
}

function parseFlags(flagsStr){
  if(!flagsStr) return [];
  return flagsStr.split(",").map(s=>s.trim()).filter(Boolean);
}

function setScrollText(id, html){
  document.getElementById(id).innerHTML = html;
}

/* ==== OGRO / PORTAL con outcome_id único ==== */
function conditionsMatch(cond){
  if(!cond) return true;
  if(cond.estado_ogro && cond.estado_ogro !== state.ogre.estado_ogro) return false;
  if(cond.flags_all){
    for(const f of cond.flags_all){
      if(!state.ogre.flags.has(f)) return false;
    }
  }
  return true;
}

function useOnOgre(itemId){
  removeFromInventory(itemId);

  const row = DATA.ogro.find(x => x.item === itemId);
  if(row){
    parseFlags(row.flags_set).forEach(f=>state.ogre.flags.add(f));
    state.ogre.outcome = row.outcome;
    state.ogre.outcome_id = row.outcome_id || null;
    state.ogre.estado_ogro = row.estado_ogro || "vivo";
    setScrollText("ogreNarrative", row.texto || `Usás ${itemName(itemId)} con el ogro.`);
  } else {
    state.ogre.outcome = "neutral";
    state.ogre.outcome_id = `ogro__${itemId}__neutral`;
    state.ogre.estado_ogro = "confundido";
    setScrollText("ogreNarrative", `Usás ${itemName(itemId)} con el ogro. El ogro… no sabe qué opinar.`);
  }

  if(state.ogre.outcome === "jugador_muere"){
    state.phase = "end";
    setScrollText("portalNarrative", "Has muerto. No hay portal para vos.");
    state.last_final_outcome_id = state.ogre.outcome_id; // queda como ending del run
    render();
    return;
  }

  // sobreviviste => portal
  state.phase = "portal";
  setScrollText("portalNarrative", "Ahora: tirá el objeto restante al portal.");
  render();
}

function useOnPortal(itemId){
  removeFromInventory(itemId);

  const rows = DATA.portal.filter(x => x.item === itemId);

  // más específico primero (flags_all > estado_ogro > genérico)
  const scored = rows.map(r=>{
    const c = r.condiciones || null;
    let score = 0;
    if(c?.flags_all?.length) score += 10 + c.flags_all.length;
    if(c?.estado_ogro) score += 5;
    return {r, score};
  }).sort((a,b)=>b.score-a.score);

  let picked = null;
  for(const {r} of scored){
    if(conditionsMatch(r.condiciones)) { picked = r; break; }
  }
  if(!picked){
    // fallback por item sin condiciones si existe
    picked = rows.find(r=>!r.condiciones) || null;
  }

  if(picked){
    setScrollText("portalNarrative", picked.texto || `Cruzás el portal con ${itemName(itemId)}.`);
    state.last_final_outcome_id = picked.outcome_id || `final__${itemId}__generico`;
  } else {
    setScrollText("portalNarrative", `Tirás ${itemName(itemId)} al portal. El portal decide por vos.`);
    state.last_final_outcome_id = `final__${itemId}__portal_decide`;
  }

  state.phase = "end";
  render();
}

/* ==== CSV loader (compatible con tu game_data.csv) ==== */
function parseCSV(text){
  const rows = [];
  let i=0, field="", row=[], inQuotes=false;
  const pushField=()=>{ row.push(field); field=""; };
  const pushRow=()=>{ if(row.length && row.some(x=>x.trim()!=="")) rows.push(row); row=[]; };

  while(i<text.length){
    const ch=text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field+='"'; i+=2; continue; }
        inQuotes=false; i++; continue;
      }
      field+=ch; i++; continue;
    } else {
      if(ch === '"'){ inQuotes=true; i++; continue; }
      if(ch === ','){ pushField(); i++; continue; }
      if(ch === '\n'){ pushField(); pushRow(); i++; continue; }
      if(ch === '\r'){ i++; continue; }
      field+=ch; i++; continue;
    }
  }
  pushField(); pushRow();
  return rows;
}
function rowsToObjects(rows){
  const [header,...data]=rows;
  const keys=header.map(h=>h.trim());
  return data.map(r=>{
    const o={};
    keys.forEach((k,idx)=>o[k]=(r[idx]??"").trim());
    return o;
  });
}

async function loadCSV(){
  try{
    const res = await fetch(CSV_URL, { cache:"no-store" });
    if(!res.ok) throw new Error("csv not found");
    const text = await res.text();
    const objs = rowsToObjects(parseCSV(text));

    DATA = { items:[], recetas_t1:[], ogro:[], portal:[] };

    for(const o of objs){
      const t=o.tabla;
      if(t==="items"){
        DATA.items.push({ id:o.id, nombre:o.nombre, tipo:o.tipo||"base" });
      }
      if(t==="recetas_t1"){
        DATA.recetas_t1.push({ a:o.a, b:o.b, result:o.result });
      }
      if(t==="ogro"){
        DATA.ogro.push({
          item:o.item,
          outcome:o.outcome,
          outcome_id:o.outcome_id,
          estado_ogro:o.estado_ogro,
          flags_set:o.flags_set,
          texto:o.texto
        });
      }
      if(t==="portal"){
        let condiciones=null;
        if(o.condiciones){
          try{ condiciones=JSON.parse(o.condiciones); } catch { condiciones=null; }
        }
        DATA.portal.push({
          item:o.item,
          outcome:o.outcome,
          outcome_id:o.outcome_id,
          condiciones,
          texto:o.texto
        });
      }
    }

    rebuildTier1Maps();
    newRun();
    setScrollText("ogreNarrative", `CSV cargado OK. items=${DATA.items.length}, t1=${DATA.recetas_t1.length}, ogro=${DATA.ogro.length}, portal=${DATA.portal.length}`);
  } catch(e){
    DATA = structuredClone(FALLBACK_DATA);
    rebuildTier1Maps();
    newRun();
    setScrollText("ogreNarrative", `No pude cargar ${CSV_URL}. Usando fallback.`);
  }
}

function newRun(){
  state.phase="combine";
  state.ogre = { outcome:null, outcome_id:null, estado_ogro:null, flags:new Set() };
  state.last_final_outcome_id = null;

  // 4 objetos random del pool base
  const basePool = DATA.items.filter(x=>x.tipo==="base").map(x=>x.id);
  state.inventory = pickDistinct(basePool, 4);

  setScrollText("ogreNarrative", "Arrastrá y combiná. O usá un objeto con el OGRO.");
  setScrollText("portalNarrative", "Después del ogro, tirá el objeto restante al PORTAL.");
  render();
}

/* ==== UI buttons ==== */
document.getElementById("btnNewRun").addEventListener("click", newRun);
document.getElementById("btnReloadData").addEventListener("click", loadCSV);

loadCSV();
</script>
</body>
</html>
