<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>El ogro y el portal</title>
  <style>
    :root{
      --ui-max: 540px;
      --pad: 12px;
      --gap: 10px;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --text: #f6f1e6;
      --panelText: #2b2217;
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:#000;
      min-height:100svh;
      display:flex;
      justify-content:center;
    }
    #app{
      width:min(100vw, var(--ui-max));
      min-height:100svh;
      position:relative;
      overflow:hidden;
      background:#000;
    }
    /* Background */
    #bg{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      filter:saturate(1.05) contrast(1.03);
      transform: scale(1.02);
    }
    #bg::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(circle at 50% 30%, rgba(0,0,0,.10), rgba(0,0,0,.55));
      pointer-events:none;
    }

    /* Top UI */
    #topbar{
      position:relative;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--gap);
      padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) var(--pad);
      z-index:5;
    }
    .topbtn{
      border:0;
      cursor:pointer;
      color:#111;
      font-weight:800;
      letter-spacing:.5px;
      text-transform:uppercase;
      padding: 14px 10px;
      background: rgba(255,255,255,.9);
      box-shadow: var(--shadow);
      border-radius: 10px;
      position:relative;
      overflow:hidden;
    }
    .topbtn::before{
      content:"";
      position:absolute; inset:-2px;
      background-size:100% 100%;
      background-repeat:no-repeat;
      opacity:1;
      pointer-events:none;
      mix-blend-mode: multiply;
    }
    .topbtn span{ position:relative; z-index:1; }
    .topbtn:active{ transform: translateY(1px); }

    /* Items row */
    #itemsRow{
      position:relative;
      z-index:5;
      padding: 0 var(--pad);
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
    }

    .itemSlot{
      position:relative;
      aspect-ratio: 1 / 1;
      user-select:none;
      -webkit-user-select:none;
      touch-action: manipulation;
      border-radius: 14px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }
    .itemSlot.disabled{
      opacity:.35;
      filter: grayscale(.4);
      pointer-events:none;
    }
    .itemSlot .frame{
      position:absolute; inset:0;
      background-size:100% 100%;
      background-repeat:no-repeat;
    }
    .itemSlot .content{
      position:absolute; inset:10% 10% 18%;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }
    .itemSlot img.itemImg{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.35));
      display:none; /* se activa si hay imagen */
    }
    .itemSlot .fallbackEmoji{
      font-size: 34px;
      opacity:.9;
      display:none;
    }
    .itemSlot .label{
      position:absolute;
      left:10%;
      right:10%;
      bottom:7%;
      height:14%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      text-transform:uppercase;
      font-size: 12px;
      color: #1f160d;
      text-shadow: none;
      pointer-events:none;
      line-height: 1.1;
      text-align:center;
      padding: 0 4px;
    }
    .itemSlot.selected .frame{
      filter: drop-shadow(0 0 12px rgba(120,210,255,.65));
      transform: scale(1.01);
    }

    /* Scene */
    #scene{
      position:relative;
      height: min(56svh, 520px);
      z-index:3;
    }

    #portalHotspot{
      position:absolute;
      left: 50%;
      top: 56%;
      width: 38%;
      height: 26%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      border-radius: 999px;
      pointer-events:none; /* desactivado al inicio */
    }
    #portalHotspot.enabled{
      pointer-events:auto;
    }
    /* Glow invisible cuando está enabled */
    #portalHotspot.enabled::after{
      content:"";
      position:absolute; inset:-10%;
      border-radius:999px;
      background: radial-gradient(circle, rgba(110,220,255,.35), rgba(110,220,255,0) 70%);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{ transform: scale(.98); opacity:.75; }
      50%{ transform: scale(1.06); opacity:1; }
    }

    .sprite{
      position:absolute;
      image-rendering:auto;
      pointer-events:none;
      user-select:none;
      -webkit-user-select:none;
    }

    #ogre{
      width: 36%;
      left: 60%;
      top: 56%;
      transform: translate(-50%,-60%);
      transition: all .35s ease;
      z-index:4;
    }
    #ogre.friend{
      left: 80%;
      top: 58%;
      transform: translate(-50%,-60%) scale(.96);
    }
    #adventurer{
      width: 22%;
      left: 46%;
      top: 74%;
      transform: translate(-50%,-70%);
      z-index:4;
    }

    /* Narrative scroll */
    #narrativeWrap{
      position:relative;
      z-index:6;
      padding: var(--pad);
      padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
    }
    #scrollPanel{
      position:relative;
      width:100%;
      aspect-ratio: 2 / 1;
      background-size:100% 100%;
      background-repeat:no-repeat;
      box-shadow: var(--shadow);
      border-radius: 14px;
      overflow:hidden;
    }
    #scrollText{
      position:absolute;
      inset: 38% 9% 10% 18%;
      color: var(--panelText);
      font-weight: 650;
      font-size: 14px;
      line-height: 1.25;
      overflow:auto;
      padding-right: 6px;
      white-space: pre-wrap;
    }
    #scrollText::-webkit-scrollbar{ width: 10px; }
    #scrollText::-webkit-scrollbar-thumb{ background: rgba(0,0,0,.18); border-radius: 12px; }

    /* Overlay result */
    #overlay{
      position:absolute; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:20;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(2px);
      padding: 20px;
    }
    #overlay.show{ display:flex; }
    #overlay img{
      max-width: min(92%, 520px);
      height:auto;
      filter: drop-shadow(0 14px 22px rgba(0,0,0,.55));
    }

    /* Popup */
    #popup{
      position:absolute; inset:0;
      display:none;
      z-index:30;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(3px);
      padding: 18px;
    }
    #popup.show{ display:block; }
    #popupCard{
      width:100%;
      max-height: 86svh;
      overflow:auto;
      background: rgba(25,18,12,.95);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 14px;
    }
    #popupHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }
    #popupTitle{
      font-weight: 900;
      letter-spacing:.5px;
      text-transform:uppercase;
      margin:0;
      font-size: 16px;
    }
    #popupClose{
      border:0;
      background: rgba(255,255,255,.12);
      color: var(--text);
      font-weight: 900;
      border-radius: 10px;
      padding: 10px 12px;
      cursor:pointer;
    }
    #popupBody{
      color: rgba(246,241,230,.95);
      font-size: 14px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    /* Small desktop widen */
    @media (min-width: 900px){
      body{ background:#111; }
      #app{ border-radius: 18px; box-shadow: var(--shadow); margin: 14px 0; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="bg"></div>

    <!-- Overlay result -->
    <div id="overlay" title="Click para cerrar">
      <img id="overlayImg" alt="Resultado" />
    </div>

    <!-- Popups -->
    <div id="popup">
      <div id="popupCard">
        <div id="popupHeader">
          <h3 id="popupTitle">Popup</h3>
          <button id="popupClose">CERRAR</button>
        </div>
        <div id="popupBody"></div>
      </div>
    </div>

    <!-- Top buttons -->
    <div id="topbar">
      <button class="topbtn" id="btnNew"><span>NUEVO JUEGO</span></button>
      <button class="topbtn" id="btnBadges"><span>LOGROS</span></button>
      <button class="topbtn" id="btnAbout"><span>ACERCA DE</span></button>
    </div>

    <!-- Items -->
    <div id="itemsRow"></div>

    <!-- Scene -->
    <div id="scene">
      <!-- Invisible portal hotspot -->
      <div id="portalHotspot" aria-label="Portal"></div>

      <img id="ogre" class="sprite" alt="Ogro" />
      <img id="adventurer" class="sprite" alt="Aventurero" />
    </div>

    <!-- Narrative -->
    <div id="narrativeWrap">
      <div id="scrollPanel">
        <div id="scrollText"></div>
      </div>
    </div>
  </div>

<script>
/** =========================
 *  CONFIG: assets + data
 *  ========================= */
const ASSETS = {
  bg: "assets/bg.jpg",
  scroll: "assets/scroll.png",
  itemFrame: "assets/item_frame.png",
  itemFrameGlow: "assets/item_frame_glow.png",
  buttonBg: "assets/button_4x1.png",

  ogre: {
    normal: "assets/ogro_normal.png",
    angry: "assets/ogro_enojado.png",
    friend: "assets/ogro_amigo.png",
    dead: "assets/ogro_muerto.png",
  },
  adventurer: {
    normal: "assets/aventurero.png",
    dead: "assets/aventurero_muerto.png",
  },
  overlay: {
    dead: "assets/overlay_has_muerto.png",
    ogreDead: "assets/overlay_ogro_muerto.png",
    ogreFriend: "assets/overlay_ogro_amigo.png",
  },

  // Imágenes de items (opcional). Si no existe, se muestra fallback.
  itemImagePath: (itemId) => `assets/items/${itemId}.png`,
};

const DATA_PATHS = {
  items: "data/items.json",
  combinaciones: "data/combinaciones.json",
  narrOgro: "data/narrativas_ogro.json",
  narrPortal: "data/narrativas_portal.json",
  badges: "data/badges.json",
};

const STORAGE_KEY = "ogro_portal_badges_v1";

/** =========================
 *  STATE
 *  ========================= */
let DB = null;

let game = {
  phase: "ogre", // "ogre" | "portal" | "ended"
  inventory: [], // array de itemIds (length 4), null si slot vacío
  usedOnOgreItemId: null,
  ogreOutcome: null, // "amistad" | "victoria" | "derrota"
  selectedSlotIndex: null,
};

let unlockedBadges = new Set();

/** =========================
 *  DOM
 *  ========================= */
const bgEl = document.getElementById("bg");
const itemsRowEl = document.getElementById("itemsRow");
const ogreEl = document.getElementById("ogre");
const advEl = document.getElementById("adventurer");
const portalEl = document.getElementById("portalHotspot");

const scrollPanelEl = document.getElementById("scrollPanel");
const scrollTextEl = document.getElementById("scrollText");

const overlayEl = document.getElementById("overlay");
const overlayImgEl = document.getElementById("overlayImg");

const popupEl = document.getElementById("popup");
const popupTitleEl = document.getElementById("popupTitle");
const popupBodyEl = document.getElementById("popupBody");
const popupCloseEl = document.getElementById("popupClose");

document.getElementById("btnNew").addEventListener("click", () => newGame());
document.getElementById("btnBadges").addEventListener("click", () => showBadgesPopup());
document.getElementById("btnAbout").addEventListener("click", () => showAboutPopup());
popupCloseEl.addEventListener("click", () => hidePopup());
popupEl.addEventListener("click", (e) => { if (e.target === popupEl) hidePopup(); });

overlayEl.addEventListener("click", () => hideOverlay());

/** =========================
 *  INIT
 *  ========================= */
(async function init(){
  // Apply background & UI skins
  bgEl.style.backgroundImage = `url('${ASSETS.bg}')`;
  scrollPanelEl.style.backgroundImage = `url('${ASSETS.scroll}')`;

  // top buttons background image
  document.querySelectorAll(".topbtn").forEach(btn => {
    btn.style.background = "rgba(255,255,255,.92)";
    btn.style.border = "2px solid rgba(120,0,0,.55)";
    btn.style.borderRadius = "10px";
    btn.style.boxShadow = "0 10px 22px rgba(0,0,0,.35)";
    btn.style.position = "relative";
    btn.style.overflow = "hidden";
    btn.style.backgroundImage = `url('${ASSETS.buttonBg}')`;
    btn.style.backgroundSize = "100% 100%";
    btn.style.backgroundRepeat = "no-repeat";
  });

  loadUnlockedBadges();

  DB = await loadDB();
  buildItemSlots();

  // initial sprites
  setOgreState("normal");
  setAdventurerState("normal");
  portalEl.classList.remove("enabled");

  await newGame();
})();

/** =========================
 *  DATA LOADING
 *  ========================= */
async function loadJSON(path){
  const res = await fetch(path, { cache: "no-store" });
  if(!res.ok) throw new Error(`No pude cargar ${path}: ${res.status}`);
  return await res.json();
}

async function loadDB(){
  const [items, combinaciones, narrOgro, narrPortal, badges] = await Promise.all([
    loadJSON(DATA_PATHS.items),
    loadJSON(DATA_PATHS.combinaciones),
    loadJSON(DATA_PATHS.narrOgro),
    loadJSON(DATA_PATHS.narrPortal),
    loadJSON(DATA_PATHS.badges),
  ]);

  // indices rápidos
  const itemById = new Map(items.map(it => [it.id, it]));
  const comboMap = new Map();
  for(const c of combinaciones){
    const a = Math.min(c.id_itemA, c.id_itemB);
    const b = Math.max(c.id_itemA, c.id_itemB);
    comboMap.set(`${a}-${b}`, c.id_itemresultante);
  }
  const ogreByItem = new Map(narrOgro.map(n => [n.id_item, n]));
  // portal: key = `${ogreItemOrNull}|${portalItem}|${conOgro}`
  const portalMap = new Map();
  for(const p of narrPortal){
    const k = `${p.id_item_ogro ?? "null"}|${p.id_item_portal}|${p.con_ogro}`;
    portalMap.set(k, p);
  }
  const badgeById = new Map(badges.map(b => [b.id_badge, b]));

  return { items, combinaciones, narrOgro, narrPortal, badges, itemById, comboMap, ogreByItem, portalMap, badgeById };
}

function itemName(id){
  return DB?.itemById.get(id)?.nombre ?? `Item ${id}`;
}

/** =========================
 *  UI BUILD: Item Slots
 *  ========================= */
function buildItemSlots(){
  itemsRowEl.innerHTML = "";
  for(let i=0;i<4;i++){
    const slot = document.createElement("div");
    slot.className = "itemSlot";
    slot.dataset.slot = String(i);

    // Drag & drop handlers (desktop)
    slot.draggable = true;
    slot.addEventListener("dragstart", onDragStart);
    slot.addEventListener("dragover", (e) => e.preventDefault());
    slot.addEventListener("drop", onDrop);

    // Tap/click (mobile friendly)
    slot.addEventListener("click", () => onSlotClick(i));

    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.backgroundImage = `url('${ASSETS.itemFrame}')`;

    const content = document.createElement("div");
    content.className = "content";

    const img = document.createElement("img");
    img.className = "itemImg";
    img.alt = "Item";

    const emoji = document.createElement("div");
    emoji.className = "fallbackEmoji";
    emoji.textContent = "❔";

    content.appendChild(img);
    content.appendChild(emoji);

    const label = document.createElement("div");
    label.className = "label";

    slot.appendChild(frame);
    slot.appendChild(content);
    slot.appendChild(label);

    itemsRowEl.appendChild(slot);
  }
  renderInventory();
}

function renderInventory(){
  const slots = [...document.querySelectorAll(".itemSlot")];
  slots.forEach((slot, idx) => {
    const itemId = game.inventory[idx];
    const label = slot.querySelector(".label");
    const img = slot.querySelector(".itemImg");
    const emoji = slot.querySelector(".fallbackEmoji");
    const frame = slot.querySelector(".frame");

    slot.classList.toggle("selected", game.selectedSlotIndex === idx);

    if(itemId == null){
      label.textContent = "";
      img.style.display = "none";
      emoji.style.display = "none";
      slot.classList.add("disabled");
      return;
    }
    slot.classList.remove("disabled");
    label.textContent = itemName(itemId).toUpperCase();

    // Try load image
    img.src = ASSETS.itemImagePath(itemId);
    img.onerror = () => {
      img.style.display = "none";
      emoji.style.display = "flex";
      emoji.textContent = guessEmoji(itemName(itemId));
    };
    img.onload = () => {
      img.style.display = "block";
      emoji.style.display = "none";
    };

    // highlight frame on selection
    frame.style.backgroundImage = `url('${ASSETS.itemFrame}')`;
    if(game.selectedSlotIndex === idx){
      frame.style.backgroundImage = `url('${ASSETS.itemFrameGlow}')`;
    }
  });
}

function guessEmoji(name){
  const n = name.toLowerCase();
  if(n.includes("agua") || n.includes("marea") || n.includes("lluvia")) return "💧";
  if(n.includes("fuego") || n.includes("llama") || n.includes("antorcha") || n.includes("bras")) return "🔥";
  if(n.includes("pesc")) return "🐟";
  if(n.includes("piedra") || n.includes("roca") || n.includes("ladrillo")) return "🪨";
  if(n.includes("magia") || n.includes("hechizo") || n.includes("encant")) return "✨";
  if(n.includes("cuerda") || n.includes("lazo") || n.includes("trampa")) return "🪢";
  if(n.includes("espejo") || n.includes("reflejo")) return "🪞";
  if(n.includes("portal")) return "🌀";
  if(n.includes("oro")) return "🪙";
  if(n.includes("dragón")) return "🐉";
  if(n.includes("martillo")) return "🔨";
  if(n.includes("anguila") || n.includes("eléct")) return "⚡";
  return "❔";
}

/** =========================
 *  GAME FLOW
 *  ========================= */
async function newGame(){
  game.phase = "ogre";
  game.usedOnOgreItemId = null;
  game.ogreOutcome = null;
  game.selectedSlotIndex = null;

  // pick 4 random base items (IDs 1..8)
  const baseIds = DB.items.filter(it => it.id >= 1 && it.id <= 8).map(it => it.id);
  shuffle(baseIds);
  game.inventory = baseIds.slice(0,4);

  // reset sprites
  setOgreState("normal");
  ogreEl.classList.remove("friend");
  setAdventurerState("normal");
  portalEl.classList.remove("enabled");

  await setNarrative("Elegí un objeto y usalo contra el ogro. Podés combinar dos objetos tocando uno y después otro.\n\n(En PC también podés arrastrar un item sobre otro).");

  renderInventory();
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/** =========================
 *  INPUT: combine / use
 *  ========================= */
function onSlotClick(idx){
  const itemId = game.inventory[idx];
  if(itemId == null) return;

  // If game ended, ignore
  if(game.phase === "ended") return;

  // If phase portal and portal enabled: clicking item selects it for portal
  if(game.phase === "portal"){
    game.selectedSlotIndex = (game.selectedSlotIndex === idx) ? null : idx;
    renderInventory();
    return;
  }

  // phase ogre: selection logic for combine
  if(game.selectedSlotIndex == null){
    game.selectedSlotIndex = idx;
    renderInventory();
    return;
  }

  if(game.selectedSlotIndex === idx){
    // Use selected item on ogre (tap same item twice)
    useOnOgre(idx);
    return;
  }

  // combine selected + clicked
  const aIdx = game.selectedSlotIndex;
  combineSlots(aIdx, idx);
  game.selectedSlotIndex = null;
  renderInventory();
}

function onDragStart(e){
  const slotIdx = Number(e.currentTarget.dataset.slot);
  if(game.inventory[slotIdx] == null) return;
  e.dataTransfer.setData("text/plain", String(slotIdx));
}
function onDrop(e){
  e.preventDefault();
  const fromIdx = Number(e.dataTransfer.getData("text/plain"));
  const toIdx = Number(e.currentTarget.dataset.slot);
  if(Number.isNaN(fromIdx) || Number.isNaN(toIdx) || fromIdx === toIdx) return;

  if(game.phase === "ogre"){
    combineSlots(fromIdx, toIdx);
    renderInventory();
  }else if(game.phase === "portal"){
    // drag item onto portal OR another item (no combine in portal phase typically; dejamos disabled)
    game.selectedSlotIndex = fromIdx;
    renderInventory();
  }
}

function combineSlots(iA, iB){
  const idA = game.inventory[iA];
  const idB = game.inventory[iB];
  if(idA == null || idB == null) return;

  const a = Math.min(idA,idB);
  const b = Math.max(idA,idB);
  const key = `${a}-${b}`;
  const resultId = DB.comboMap.get(key);

  if(!resultId){
    // no sense combo
    void setNarrative(`Intentás combinar **${itemName(idA)}** con **${itemName(idB)}**.\n\nNada. El universo te mira raro y sigue su camino.`);
    return;
  }

  // consume both -> put result into target slot (iB), clear source (iA)
  game.inventory[iB] = resultId;
  game.inventory[iA] = null;

  void setNarrative(`Combinación: **${itemName(idA)} + ${itemName(idB)} = ${itemName(resultId)}**.\n\nAhora podés seguir combinando o usar un objeto con el ogro (tocá dos veces el mismo item para usarlo).`);
}

async function useOnOgre(slotIdx){
  if(game.phase !== "ogre") return;
  const itemId = game.inventory[slotIdx];
  if(itemId == null) return;

  const narr = DB.ogreByItem.get(itemId);
  if(!narr){
    await setNarrative(`Usás **${itemName(itemId)}** con el ogro.\n\nNo hay narrativa cargada. (Esto no debería pasar).`);
    return;
  }

  game.usedOnOgreItemId = itemId;
  game.ogreOutcome = narr.estado;

  // apply narrative
  await setNarrative(narr.narrativa);

  // apply badge if any
  if(narr.id_badge != null) unlockBadge(narr.id_badge);

  // state transitions
  if(narr.estado === "derrota"){
    setOgreState("angry");
    setAdventurerState("dead");
    showOverlay("dead");
    game.phase = "ended";
    portalEl.classList.remove("enabled");
    return;
  }

  if(narr.estado === "victoria"){
    setOgreState("dead");
    showOverlay("ogreDead");
    game.phase = "portal";
    portalEl.classList.add("enabled");
    ogreEl.classList.remove("friend");
  }

  if(narr.estado === "amistad"){
    setOgreState("friend");
    ogreEl.classList.add("friend");
    showOverlay("ogreFriend");
    game.phase = "portal";
    portalEl.classList.add("enabled");
  }

  // After ogre interaction, disable using ogre again; only portal phase
}

/** =========================
 *  PORTAL
 *  ========================= */
portalEl.addEventListener("click", async () => {
  if(!portalEl.classList.contains("enabled")) return;
  if(game.phase !== "portal") return;

  // need one remaining item selected or pick the first non-null
  let slotIdx = game.selectedSlotIndex;
  if(slotIdx == null){
    slotIdx = game.inventory.findIndex(x => x != null);
  }
  if(slotIdx < 0) return;

  const portalItemId = game.inventory[slotIdx];
  if(portalItemId == null) return;

  const conOgro = (game.ogreOutcome === "amistad");
  const ogreItemId = game.usedOnOgreItemId;

  // 1) special
  let entry = null;
  if(conOgro && ogreItemId != null){
    const kSpecial = `${ogreItemId}|${portalItemId}|true`;
    entry = DB.portalMap.get(kSpecial) ?? null;
  }
  // 2) normal
  if(!entry){
    const kNormal = `null|${portalItemId}|${conOgro}`;
    entry = DB.portalMap.get(kNormal) ?? null;
  }

  if(!entry){
    await setNarrative("El portal decide por vos.\n\nTe succiona con criterio artístico dudoso y te deja en un lugar que no estaba en el presupuesto.");
    game.phase = "ended";
    portalEl.classList.remove("enabled");
    return;
  }

  // consume portal item
  game.inventory[slotIdx] = null;
  game.selectedSlotIndex = null;
  renderInventory();

  await setNarrative(entry.narrativa);

  if(entry.id_badge != null) unlockBadge(entry.id_badge);

  game.phase = "ended";
  portalEl.classList.remove("enabled");
});

/** =========================
 *  NARRATIVE: progressive text
 *  ========================= */
let typingToken = 0;

async function setNarrative(text){
  typingToken++;
  const token = typingToken;

  // Basic markdown-ish bold **...**
  const cleaned = String(text ?? "");
  scrollTextEl.textContent = "";

  const speed = 10; // ms per char (ajustable)
  for(let i=0;i<cleaned.length;i++){
    if(token !== typingToken) return;
    scrollTextEl.textContent += cleaned[i];
    // autoscroll
    scrollTextEl.scrollTop = scrollTextEl.scrollHeight;
    await sleep(speed);
  }
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/** =========================
 *  SPRITES
 *  ========================= */
function setOgreState(state){
  ogreEl.src = ASSETS.ogre[state] || ASSETS.ogre.normal;
}
function setAdventurerState(state){
  advEl.src = ASSETS.adventurer[state] || ASSETS.adventurer.normal;
}

/** =========================
 *  OVERLAY
 *  ========================= */
let overlayTimer = null;

function showOverlay(kind){
  const src = ASSETS.overlay[kind];
  if(!src) return;
  overlayImgEl.src = src;
  overlayEl.classList.add("show");

  if(overlayTimer) clearTimeout(overlayTimer);
  overlayTimer = setTimeout(() => hideOverlay(), 3000);
}
function hideOverlay(){
  overlayEl.classList.remove("show");
  if(overlayTimer) clearTimeout(overlayTimer);
  overlayTimer = null;
}

/** =========================
 *  POPUPS
 *  ========================= */
function showPopup(title, body){
  popupTitleEl.textContent = title;
  popupBodyEl.textContent = body;
  popupEl.classList.add("show");
}
function hidePopup(){
  popupEl.classList.remove("show");
}

function showBadgesPopup(){
  const all = DB.badges.slice().sort((a,b)=>a.id_badge-b.id_badge);
  const lines = [];
  lines.push("LOGROS\n");
  for(const b of all){
    const ok = unlockedBadges.has(b.id_badge);
    lines.push(`${ok ? "✅" : "⬜"} [${b.id_badge}] ${b.descripcion}`);
  }
  showPopup("LOGROS", lines.join("\n"));
}

function showAboutPopup(){
  const txt =
`EL OGRO Y EL PORTAL

Este juego fue forjado por Mateo, un alquimista narrativo capaz de convertir tres objetos tontos en una epopeya absurda.
Su talento especial es lograr que cada combinación parezca inevitable… aunque sea completamente ridícula.

Y sí: si el juego te hizo reír, sorprenderte o decir “no puede ser”, eso cuenta como magia real.
(El ogro no confirma ni desmiente.)`;
  showPopup("ACERCA DE", txt);
}

/** =========================
 *  BADGES persistence
 *  ========================= */
function loadUnlockedBadges(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)){
      unlockedBadges = new Set(arr.filter(n => Number.isFinite(n)));
    }
  }catch(_){}
}
function saveUnlockedBadges(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...unlockedBadges]));
  }catch(_){}
}
function unlockBadge(id_badge){
  if(!Number.isFinite(id_badge)) return;
  unlockedBadges.add(id_badge);
  saveUnlockedBadges();
}
</script>
