<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>El ogro y el portal</title>
  <style>
    :root{
      --pad: 12px;
      --radius: 14px;
      --panel: rgba(10, 12, 20, 0.72);
      --panel2: rgba(10, 12, 20, 0.55);
      --border: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --accent: rgba(255, 213, 110, 0.95);
      --bad: rgba(255, 120, 120, 0.95);
      --good: rgba(140, 255, 180, 0.95);
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
      color: var(--text);
      background: #0b0e16;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Fondo fantasía medieval (placeholder). Reemplazá assets/bg.jpg cuando quieras */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(255,255,255,0.10), transparent 60%),
        radial-gradient(900px 600px at 85% 25%, rgba(255,213,110,0.10), transparent 55%),
        linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.65)),
        url("assets/bg.jpg");
      background-size: cover;
      background-position: center;
      filter: saturate(1.05) contrast(1.02);
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.20), rgba(0,0,0,0.72));
      z-index:-1;
    }

    header{
      padding: 14px var(--pad) 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }

    .title{
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .title h1{
      margin:0;
      font-size: 16px;
      letter-spacing: 0.3px;
    }
    .title .sub{
      margin:0;
      font-size: 12px;
      color: var(--muted);
    }

    .btn{
      border:1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      border-color: rgba(255,213,110,0.35);
      background: rgba(255,213,110,0.12);
      color: var(--accent);
    }

    .layout{
      display:grid;
      grid-template-columns: 1fr;
      gap: var(--pad);
      padding: 0 var(--pad) var(--pad);
    }

    /* Desktop split: narrativa izquierda, escena+inventario derecha */
    @media (min-width: 980px){
      .layout{
        grid-template-columns: 380px 1fr;
        align-items: start;
      }
    }

    .panel{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }

    /* Narrativa */
    .log{
      height: min(62vh, 520px);
      overflow:auto;
      padding: var(--pad);
      background: var(--panel2);
    }
    @media (max-width: 979px){
      .log{ height: 30vh; }
    }

    .entry{
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .entry .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .pill{
      display:inline-flex;
      font-weight: 800;
      letter-spacing: .3px;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
    }
    .pill.good{ color: var(--good); border-color: rgba(140,255,180,0.35); background: rgba(140,255,180,0.10); }
    .pill.bad{ color: var(--bad); border-color: rgba(255,120,120,0.35); background: rgba(255,120,120,0.10); }
    .pill.accent{ color: var(--accent); border-color: rgba(255,213,110,0.35); background: rgba(255,213,110,0.10); }

    .entry .text{
      font-size: 14px;
      line-height: 1.4;
      color: var(--text);
      white-space: normal;
    }
    .entry .text br{ line-height: 1.8; }

    /* Escena */
    .scene{
      position:relative;
      height: min(52vh, 520px);
      background: rgba(0,0,0,0.18);
    }
    @media (max-width: 979px){
      .scene{ height: 44vh; }
    }

    .scene .frame{
      position:absolute;
      inset: 0;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding: var(--pad);
      gap: var(--pad);
    }

    /* Zona droppable del ogro/portal */
    .dropzone{
      flex: 1;
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.20);
      position: relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .dropzone.disabled{
      opacity: 0.55;
      filter: grayscale(0.35);
      pointer-events:none;
    }

    .dz-label{
      position:absolute;
      top: 10px;
      left: 10px;
      font-size: 12px;
      color: var(--muted);
      display:flex;
      align-items:center;
      gap:8px;
      z-index: 3;
    }

    .dz-hint{
      position:absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      z-index: 3;
      text-align:left;
    }

    .entity{
      position:absolute;
      inset:0;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding: 18px;
      pointer-events:none;
    }

    /* Personajes/props */
    .sprite{
      width: min(52%, 340px);
      max-width: 92%;
      height: auto;
      opacity: 0.98;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.55));
    }
    .sprite.small{
      width: min(18%, 120px);
      opacity: 0.92;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.50));
    }
    .fallbackSprite{
      width: min(52%, 340px);
      height: min(52%, 340px);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      display:flex;
      align-items:center;
      justify-content:center;
      color: rgba(255,255,255,0.72);
      font-weight: 800;
      letter-spacing: .3px;
      padding: 18px;
      text-align:center;
    }

    .corner-ogre{
      position:absolute;
      right: 10px;
      bottom: 10px;
      z-index: 4;
      display:none;
      pointer-events:none;
    }
    .corner-ogre.show{ display:block; }

    /* Aventurero siempre presente */
    .adventurer{
      position:absolute;
      left: 10px;
      bottom: 10px;
      z-index: 4;
      pointer-events:none;
    }

    /* Inventario */
    .inventory{
      padding: var(--pad);
    }
    .invHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .invHeader .status{
      font-size: 12px;
      color: var(--muted);
    }

    .itemsGrid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 540px){
      .itemsGrid{ grid-template-columns: repeat(4, 1fr); }
    }

    .itemCard{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      padding: 10px;
      min-height: 84px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 8px;
      cursor: grab;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      position:relative;
      overflow:hidden;
    }
    .itemCard:active{ cursor: grabbing; }
    .itemCard.dragging{ opacity: 0.55; transform: scale(0.98); }

    .itemImg{
      width: 44px;
      height: 44px;
      object-fit: contain;
      display:none;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
    }
    .itemCard.hasImg .itemImg{ display:block; }
    .itemName{
      font-size: 12px;
      text-align:center;
      color: rgba(255,255,255,0.9);
      font-weight: 800;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }
    .itemMeta{
      font-size: 11px;
      color: rgba(255,255,255,0.62);
    }

    /* Target highlight */
    .droptarget{
      outline: 2px solid rgba(255,213,110,0.45);
      outline-offset: 2px;
    }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      background: rgba(10,12,20,0.88);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      color: rgba(255,255,255,0.92);
      max-width: min(620px, 92vw);
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events:none;
      transition: opacity .18s ease;
      z-index: 999;
    }
    .toast.show{ opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <h1>El ogro y el portal</h1>
      <p class="sub">Arrastrá objetos para combinarlos, y probalos con el ogro… si te animás.</p>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="btnReload">Recargar CSV</button>
      <button class="btn primary" id="btnRestart">Reiniciar partida</button>
    </div>
  </header>

  <main class="layout">
    <!-- Narrativa -->
    <section class="panel">
      <div class="log" id="log"></div>
    </section>

    <!-- Escena + Inventario -->
    <section class="panel">
      <div class="scene">
        <div class="frame">
          <div class="dropzone" id="zoneMain" aria-label="Zona principal">
            <div class="dz-label">
              <span class="pill accent" id="phasePill">FASE: OGRO</span>
              <span id="phaseHint" style="color:var(--muted); font-size:12px;">Arrastrá un objeto acá</span>
            </div>

            <!-- Render del “mundo” -->
            <div class="entity" id="entityMain"></div>

            <!-- Hint -->
            <div class="dz-hint" id="dzHint">
              Tip: Podés arrastrar un objeto sobre otro para combinarlos.
            </div>

            <!-- Aventurero siempre -->
            <div class="adventurer" id="adventurer"></div>

            <!-- Ogro chiquito (solo cuando pasás al portal y el ogro está vivo y con vos) -->
            <div class="corner-ogre" id="cornerOgre"></div>
          </div>
        </div>
      </div>

      <div class="inventory">
        <div class="invHeader">
          <div class="status" id="statusLine">Cargando datos…</div>
          <div class="status" id="stateLine">—</div>
        </div>
        <div class="itemsGrid" id="itemsGrid"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // -----------------------------
    // Config de assets (podés cambiar rutas)
    // -----------------------------
    const ASSETS = {
      bg: "assets/bg.jpg",
      ogre: "assets/ogro.png",
      portal: "assets/portal.png",
      adventurer: "assets/aventurero.png",
      item: (id) => `assets/items/${id}.png`,
    };

    // -----------------------------
    // Estado de juego
    // -----------------------------
    const Game = {
      phase: "OGRE", // OGRE | PORTAL | END
      inventory: [], // array de item_id
      ogreState: "neutral", // neutral | amigo | muerto
      flags: new Set(), // e.g., ogro_es_pez, ogro_es_princesa
      data: {
        items: new Map(),         // id -> {nombre, tipo}
        recetas_t1: new Map(),    // key(a,b) -> result
        recetas_t2: new Map(),    // key(a,b) -> result
        ogro: new Map(),          // item -> row
        portal: [],               // rows array
      }
    };

    // -----------------------------
    // Utilidades
    // -----------------------------
    const $ = (sel) => document.querySelector(sel);
    const el = (tag, attrs={}, children=[]) => {
      const e = document.createElement(tag);
      for (const [k,v] of Object.entries(attrs)){
        if (k === "class") e.className = v;
        else if (k === "html") e.innerHTML = v;
        else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v);
      }
      for (const c of children) e.appendChild(c);
      return e;
    };

    const comboKey = (a,b) => [a,b].sort().join("|");

    function showToast(msg){
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"), 1400);
    }

    function safeJson(s){
      try { return JSON.parse(s); } catch { return null; }
    }

    function itemDisplayName(id){
      return Game.data.items.get(id)?.nombre || id;
    }

    async function imageExists(url){
      // Detecta si existe sin romper CORS (en GitHub Pages suele andar)
      return new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=> resolve(true);
        img.onerror = ()=> resolve(false);
        img.src = url;
      });
    }

    // -----------------------------
    // Narrativa progresiva
    // -----------------------------
    async function appendNarrative({tag, pillClass="accent", textHtml}){
      const log = $("#log");
      const entry = el("div", {class:"entry"});
      const top = el("div", {class:"tag", html: `<span class="pill ${pillClass}">${tag}</span><span>${new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})}</span>`});
      const body = el("div", {class:"text"});
      entry.appendChild(top);
      entry.appendChild(body);
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;

      // Typewriter
      const tmp = document.createElement("div");
      tmp.innerHTML = textHtml;
      const plain = tmp.textContent || "";
      const isHtml = true;

      // render char by char but keep line breaks: easiest: progressively reveal plain text,
      // and at end set innerHTML
      body.textContent = "";
      const speed = 10; // ms per char
      for (let i=0;i<plain.length;i++){
        body.textContent += plain[i];
        if (i % 6 === 0) log.scrollTop = log.scrollHeight;
        await new Promise(r=>setTimeout(r, speed));
      }
      if (isHtml) body.innerHTML = textHtml;
      log.scrollTop = log.scrollHeight;
    }

    // -----------------------------
    // Render escena
    // -----------------------------
    async function renderScene(){
      const pill = $("#phasePill");
      const hint = $("#phaseHint");
      const entity = $("#entityMain");
      const adv = $("#adventurer");
      const corner = $("#cornerOgre");

      // Aventurero
      await renderSpriteOrFallback(adv, ASSETS.adventurer, "AVENTURERO");

      entity.innerHTML = "";
      corner.innerHTML = "";
      corner.classList.remove("show");

      if (Game.phase === "OGRE"){
        pill.textContent = "FASE: OGRO";
        hint.textContent = "Arrastrá un objeto acá";
        $("#dzHint").textContent = "Arrastrá un objeto al ogro para ver qué pasa. O combiná objetos entre sí.";
        await renderSpriteOrFallback(entity, ASSETS.ogre, "OGRO");
      } else if (Game.phase === "PORTAL"){
        pill.textContent = "FASE: PORTAL";
        hint.textContent = "Arrastrá el objeto restante acá";
        $("#dzHint").textContent = "Te queda un objeto. Tiralo al portal para tu final.";
        await renderSpriteOrFallback(entity, ASSETS.portal, "PORTAL");

        if (Game.ogreState === "amigo"){
          corner.classList.add("show");
          await renderSpriteOrFallback(corner, ASSETS.ogre, "OGRO");
          const img = corner.querySelector("img");
          if (img) img.classList.add("small");
          const fb = corner.querySelector(".fallbackSprite");
          if (fb) fb.style.width = "120px";
        }
      } else {
        pill.textContent = "FIN";
        hint.textContent = "";
        $("#dzHint").textContent = "Reiniciá para probar otra combinación.";
        // Mostrar portal como fondo final
        await renderSpriteOrFallback(entity, ASSETS.portal, "PORTAL");
      }

      $("#stateLine").textContent = `Ogro: ${Game.ogreState.toUpperCase()} | Flags: ${[...Game.flags].join(", ") || "—"}`;
    }

    async function renderSpriteOrFallback(container, url, label){
      container.innerHTML = "";
      const ok = await imageExists(url);
      if (ok){
        const img = el("img", {src:url, alt:label, class:"sprite"});
        container.appendChild(img);
      } else {
        container.appendChild(el("div", {class:"fallbackSprite", html: label}));
      }
    }

    // -----------------------------
    // Render inventario
    // -----------------------------
    async function renderInventory(){
      const grid = $("#itemsGrid");
      grid.innerHTML = "";

      for (const id of Game.inventory){
        const card = el("div", {class:"itemCard", draggable:"true"});
        card.dataset.itemId = id;

        const imgUrl = ASSETS.item(id);
        const img = el("img", {class:"itemImg", alt:itemDisplayName(id)});
        // Cargamos img si existe, si no fallback textual
        if (await imageExists(imgUrl)){
          img.src = imgUrl;
          card.classList.add("hasImg");
          card.appendChild(img);
        }

        card.appendChild(el("div", {class:"itemName", html: itemDisplayName(id)}));
        card.appendChild(el("div", {class:"itemMeta", html: Game.data.items.get(id)?.tipo || ""}));

        // drag handlers
        card.addEventListener("dragstart", (e)=>{
          card.classList.add("dragging");
          e.dataTransfer.setData("text/plain", id);
          e.dataTransfer.effectAllowed = "move";
        });
        card.addEventListener("dragend", ()=>{
          card.classList.remove("dragging");
          clearDropHighlights();
        });

        // Drop onto other item to combine
        card.addEventListener("dragover", (e)=>{
          e.preventDefault();
          card.classList.add("droptarget");
        });
        card.addEventListener("dragleave", ()=>{
          card.classList.remove("droptarget");
        });
        card.addEventListener("drop", (e)=>{
          e.preventDefault();
          const from = e.dataTransfer.getData("text/plain");
          const to = id;
          if (!from || from === to) return;
          combineItems(from, to);
        });

        grid.appendChild(card);
      }

      $("#statusLine").textContent = `Inventario: ${Game.inventory.length} objeto(s).`;
    }

    function clearDropHighlights(){
      document.querySelectorAll(".droptarget").forEach(x=>x.classList.remove("droptarget"));
    }

    // -----------------------------
    // Combinar
    // -----------------------------
    function findRecipe(a,b){
      const key = comboKey(a,b);
      // prioriza t2 si uno no es base? no importa: buscamos t1 primero para base+base
      const aIsBase = Game.data.items.get(a)?.tipo === "base";
      const bIsBase = Game.data.items.get(b)?.tipo === "base";

      if (aIsBase && bIsBase){
        return Game.data.recetas_t1.get(key) || null;
      }
      return Game.data.recetas_t2.get(key) || null;
    }

    async function combineItems(a,b){
      // validar que ambos existan en inv
      if (!Game.inventory.includes(a) || !Game.inventory.includes(b)){
        showToast("Esa combinación ya no está en el inventario.");
        return;
      }

      const res = findRecipe(a,b);
      if (!res){
        showToast("No combina.");
        await appendNarrative({
          tag:"COMBINACIÓN",
          pillClass:"accent",
          textHtml:`Intentás combinar <b>${itemDisplayName(a)}</b> con <b>${itemDisplayName(b)}</b>…<br><br>El universo te mira fijo. <i>No combina.</i>`
        });
        return;
      }

      // Consumir a y b y agregar res
      Game.inventory = Game.inventory.filter(x => x !== a && x !== b);
      Game.inventory.push(res);

      await appendNarrative({
        tag:"COMBINACIÓN",
        pillClass:"accent",
        textHtml:`Combinás <b>${itemDisplayName(a)}</b> + <b>${itemDisplayName(b)}</b> = <b>${itemDisplayName(res)}</b>.`
      });

      await renderInventory();
    }

    // -----------------------------
    // Interacción con OGRO
    // -----------------------------
    async function useOnOgre(itemId){
      const row = Game.data.ogro.get(itemId);
      if (!row){
        await appendNarrative({
          tag:"OGRO",
          pillClass:"accent",
          textHtml:`Usás <b>${itemDisplayName(itemId)}</b> con el ogro…<br><br>El destino aún no escribió este evento.`
        });
        return;
      }

      // Aplicar outcome
      const outcome = row.outcome;
      const estado = row.estado_ogro || "neutral";
      Game.ogreState = estado;

      // flags
      if (row.flags_set){
        row.flags_set.split(",").map(s=>s.trim()).filter(Boolean).forEach(f=>Game.flags.add(f));
      }

      // Consumir el objeto usado con el ogro
      Game.inventory = Game.inventory.filter(x=>x !== itemId);

      let pillClass = "accent";
      if (outcome === "jugador_muere") pillClass = "bad";
      if (outcome === "ogro_muere") pillClass = "accent";
      if (outcome === "ogro_amigo") pillClass = "good";
      if (outcome === "ogro_transformado") pillClass = "good";

      await appendNarrative({
        tag:"OGRO",
        pillClass,
        textHtml: row.texto || `Usás <b>${itemDisplayName(itemId)}</b> con el ogro.`
      });

      if (outcome === "jugador_muere"){
        Game.phase = "END";
        await appendNarrative({
          tag:"RESULTADO",
          pillClass:"bad",
          textHtml:`<b>Has muerto.</b><br><br>El portal queda ahí, burlándose.`
        });
        await renderInventory();
        await renderScene();
        return;
      }

      // Si sobrevivís, pasás a PORTAL
      Game.phase = "PORTAL";
      await appendNarrative({
        tag:"TRANSICIÓN",
        pillClass:"accent",
        textHtml:`La escena cambia. Ahora solo queda el portal… y tu último objeto.`
      });

      await renderInventory();
      await renderScene();
    }

    // -----------------------------
    // Interacción con PORTAL
    // -----------------------------
    function portalPickRow(itemId){
      // Regla de selección:
      // 1) Si flags_all coincide (ogro_es_pez / ogro_es_princesa) -> final_especial
      // 2) Si ogreState === amigo -> final_bueno (condiciones estado_ogro)
      // 3) Si no -> final_malo (sin condiciones)
      const candidates = Game.data.portal.filter(r => r.item === itemId);

      // 1) especiales por flags_all
      for (const c of candidates){
        const cond = safeJson(c.condiciones || "");
        if (cond?.flags_all?.length){
          const ok = cond.flags_all.every(f => Game.flags.has(f));
          if (ok) return c;
        }
      }
      // 2) con ogro
      for (const c of candidates){
        const cond = safeJson(c.condiciones || "");
        if (cond?.estado_ogro && cond.estado_ogro === Game.ogreState) return c;
      }
      // 3) default sin condiciones
      return candidates.find(c => !c.condiciones) || candidates[0] || null;
    }

    async function useOnPortal(itemId){
      const row = portalPickRow(itemId);
      // Consumir item
      Game.inventory = Game.inventory.filter(x=>x !== itemId);

      if (!row){
        await appendNarrative({
          tag:"PORTAL",
          pillClass:"accent",
          textHtml:`Tirás <b>${itemDisplayName(itemId)}</b> al portal…<br><br>El portal hace silencio. Demasiado silencio.`
        });
        Game.phase = "END";
        await renderInventory();
        await renderScene();
        return;
      }

      await appendNarrative({
        tag:"PORTAL",
        pillClass:"accent",
        textHtml: row.texto || `Tirás <b>${itemDisplayName(itemId)}</b> al portal.`
      });

      // Mostrar outcome_id único para badges
      await appendNarrative({
        tag:"OUTCOME ID",
        pillClass:"accent",
        textHtml:`Outcome final: <code>${row.outcome_id}</code>`
      });

      Game.phase = "END";
      await renderInventory();
      await renderScene();
    }

    // -----------------------------
    // Dropzone principal
    // -----------------------------
    function setupDropzone(){
      const zone = $("#zoneMain");
      zone.addEventListener("dragover", (e)=>{
        e.preventDefault();
        zone.classList.add("droptarget");
      });
      zone.addEventListener("dragleave", ()=>{
        zone.classList.remove("droptarget");
      });
      zone.addEventListener("drop", async (e)=>{
        e.preventDefault();
        zone.classList.remove("droptarget");
        const itemId = e.dataTransfer.getData("text/plain");
        if (!itemId) return;

        if (!Game.inventory.includes(itemId)){
          showToast("Ese objeto ya no está disponible.");
          return;
        }

        if (Game.phase === "OGRE"){
          await useOnOgre(itemId);
        } else if (Game.phase === "PORTAL"){
          // solo debería quedar 1, pero no forzamos
          await useOnPortal(itemId);
        } else {
          showToast("La partida terminó. Reiniciá.");
        }
      });
    }

    // -----------------------------
    // CSV loader
    // -----------------------------
    async function loadCSV(url){
      const res = await fetch(url, {cache:"no-store"});
      if (!res.ok) throw new Error(`No pude cargar ${url} (${res.status})`);
      const text = await res.text();
      return parseCSV(text);
    }

    function parseCSV(text){
      // Parser simple que banca comillas y comas
      const rows = [];
      let i=0, field="", row=[], inQuotes=false;

      function pushField(){
        row.push(field);
        field="";
      }
      function pushRow(){
        // evita filas vacías
        if (row.some(x=>x.trim()!== "")) rows.push(row);
        row=[];
      }

      while (i < text.length){
        const c = text[i];
        if (inQuotes){
          if (c === '"'){
            if (text[i+1] === '"'){ field += '"'; i++; }
            else inQuotes=false;
          } else field += c;
        } else {
          if (c === '"') inQuotes=true;
          else if (c === ','){ pushField(); }
          else if (c === '\n'){ pushField(); pushRow(); }
          else if (c === '\r'){ /* ignore */ }
          else field += c;
        }
        i++;
      }
      if (field.length || row.length){ pushField(); pushRow(); }

      const header = rows.shift().map(h=>h.trim());
      const objs = rows.map(r=>{
        const o = {};
        header.forEach((h,idx)=> o[h] = (r[idx] ?? "").trim());
        return o;
      });
      return objs;
    }

    function ingestData(objs){
      const items = new Map();
      const r1 = new Map();
      const r2 = new Map();
      const ogro = new Map();
      const portal = [];

      for (const o of objs){
        const t = o.tabla;
        if (t === "items"){
          items.set(o.id, {nombre:o.nombre, tipo:o.tipo});
        } else if (t === "recetas_t1"){
          r1.set(comboKey(o.a,o.b), o.result);
        } else if (t === "recetas_t2"){
          r2.set(comboKey(o.a,o.b), o.result);
        } else if (t === "ogro"){
          ogro.set(o.item, o);
        } else if (t === "portal"){
          portal.push(o);
        }
      }
      Game.data.items = items;
      Game.data.recetas_t1 = r1;
      Game.data.recetas_t2 = r2;
      Game.data.ogro = ogro;
      Game.data.portal = portal;
    }

    // -----------------------------
    // Inicio / Reinicio
    // -----------------------------
    function pickRandomInventory(){
      // Por ahora pool = todos los base
      const base = [...Game.data.items.entries()]
        .filter(([id,v])=>v.tipo === "base")
        .map(([id])=>id);

      // Shuffle simple
      for (let i=base.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [base[i],base[j]] = [base[j],base[i]];
      }
      return base.slice(0,4);
    }

    async function restartGame(){
      Game.phase = "OGRE";
      Game.ogreState = "neutral";
      Game.flags = new Set();
      Game.inventory = pickRandomInventory();

      $("#log").innerHTML = "";
      await appendNarrative({
        tag:"INICIO",
        pillClass:"accent",
        textHtml:`Aparece un ogro frente a un portal. Vos, aventurero de espaldas, pensás: <i>“esto es una pésima idea”</i>.`
      });

      await renderInventory();
      await renderScene();
    }

    async function boot(){
      setupDropzone();

      try{
        const data = await loadCSV("game_data_v2.csv");
        ingestData(data);
        $("#statusLine").textContent = `Datos cargados: ${Game.data.items.size} items, ${Game.data.recetas_t1.size} t1, ${Game.data.recetas_t2.size} t2.`;
        await restartGame();
      }catch(err){
        $("#statusLine").textContent = `Error cargando CSV: ${err.message}`;
        await appendNarrative({
          tag:"ERROR",
          pillClass:"bad",
          textHtml:`No se pudo cargar <code>game_data_v2.csv</code>.<br><br>${String(err.message)}`
        });
      }

      $("#btnRestart").addEventListener("click", restartGame);
      $("#btnReload").addEventListener("click", boot);
    }

    boot();
  </script>
